<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FutureWallet &#36001;&#21209;&#27169;&#25836;&#24179;&#21488;</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-cloud cloud-1"></div>
  <div class="bg-cloud cloud-2"></div>
  <div class="bg-ground-dirt"></div>
  <div class="bg-ground-grass"></div>

  <div class="container max-w-7xl">
    <div class="w-full flex justify-center mt-6 mb-6 shrink-0">
      <div class="relative inline-flex justify-center">
        <img src="logo.png" alt="FutureWallet" class="floating-logo w-auto max-w-full max-h-[14vh] md:max-h-[18vh] object-contain px-4">
        <div id="splash-text" class="splash-text">&#36001;&#21209;&#26410;&#20358;!</div>
      </div>
    </div>

    <main class="grid grid-cols-1 xl:grid-cols-[420px_1fr] gap-5 pb-8">
      <section class="flex flex-col gap-5">
        <div class="mc-panel variant-stone relative-panel">
          <div class="panel-badge badge-stone">Auth</div>
          <h2 class="text-base mb-4 font-bold">&#24115;&#34399;</h2>
          <div id="auth-status" class="text-xs mb-3">&#23578;&#26410;&#30331;&#20837;&#12290;</div>
          <div class="grid grid-cols-1 gap-3">
            <label class="text-xs font-bold">&#24115;&#34399;<input id="auth-username" type="text" class="mc-input-pixel mt-1"></label>
            <label class="text-xs font-bold">&#38651;&#23376;&#37109;&#20214;<input id="auth-email" type="email" class="mc-input-pixel mt-1"></label>
            <label class="text-xs font-bold">&#23494;&#30908;<input id="auth-password" type="password" class="mc-input-pixel mt-1"></label>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-4">
            <button id="btn-login" class="btn-pixel bg-green text-black font-bold">&#30331;&#20837;</button>
            <button id="btn-register" class="btn-pixel bg-yellow text-black font-bold">&#35387;&#20874;</button>
            <button id="btn-logout" class="btn-pixel bg-gray text-black font-bold">&#30331;&#20986;</button>
          </div>
        </div>

        <div class="mc-panel variant-dirt relative-panel">
          <div class="panel-badge badge-dirt">Profile</div>
          <h1 class="text-white text-lg mb-4" style="text-shadow:2px 2px 0 #000;">&#36001;&#21209;&#36039;&#26009;</h1>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <label class="text-white text-xs">&#30446;&#21069;&#36039;&#29986;<input id="profile-balance" type="number" class="mc-input mt-1" value="50000"></label>
            <label class="text-white text-xs">&#27599;&#26376;&#25910;&#20837;<input id="profile-salary" type="number" class="mc-input mt-1" value="25000"></label>
            <label class="text-white text-xs">&#22266;&#23450;&#25903;&#20986;<input id="profile-fixed" type="number" class="mc-input mt-1" value="12000"></label>
            <label class="text-white text-xs">&#35722;&#21205;&#25903;&#20986;<input id="profile-variable" type="number" class="mc-input mt-1" value="6000"></label>
          </div>
        </div>

        <div class="mc-panel variant-stone relative-panel">
          <div class="panel-badge badge-stone">Model</div>
          <h2 class="text-base mb-4 font-bold">&#27169;&#22411;&#21443;&#25976;</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <label class="text-xs font-bold">&#27169;&#25836;&#26376;&#25976;<input id="model-months" type="number" class="mc-input-pixel mt-1" value="60" min="1"></label>
            <label class="text-xs font-bold">Monte Carlo &#27425;&#25976;<input id="model-mc-runs" type="number" class="mc-input-pixel mt-1" value="300" min="1"></label>
            <label class="text-xs font-bold">&#24180;&#21152;&#34218;&#29575; %<input id="model-raise" type="number" class="mc-input-pixel mt-1" value="3" step="0.1" min="0"></label>
            <label class="text-xs font-bold">&#24180;&#36890;&#33192;&#29575; %<input id="model-inflation" type="number" class="mc-input-pixel mt-1" value="2" step="0.1" min="0"></label>
            <label class="text-xs font-bold sm:col-span-2">&#32202;&#24613;&#38928;&#20633;&#37329;&#30446;&#27161;&#65288;&#26376;&#65289;<input id="model-emergency" type="number" class="mc-input-pixel mt-1" value="3" step="0.5" min="0.5"></label>
          </div>
        </div>

        <div class="mc-panel variant-stone relative-panel">
          <div class="panel-badge badge-stone">Loans</div>
          <h2 class="text-base mb-4 font-bold">&#36024;&#27454;&#27169;&#25836;</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <label class="text-xs font-bold">&#36024;&#27454;&#26412;&#37329;<input id="loan-principal" type="number" class="mc-input-pixel mt-1" placeholder="600000"></label>
            <label class="text-xs font-bold">&#24180;&#21033;&#29575; %<input id="loan-apr" type="number" class="mc-input-pixel mt-1" placeholder="3" step="0.1"></label>
            <label class="text-xs font-bold">&#36996;&#27454;&#26376;&#25976;<input id="loan-months" type="number" class="mc-input-pixel mt-1" placeholder="60"></label>
            <label class="text-xs font-bold">&#38283;&#22987;&#26376;&#20221;<input id="loan-start" type="number" class="mc-input-pixel mt-1" placeholder="1"></label>
          </div>
          <button id="btn-add-loan" class="btn-pixel bg-yellow text-black font-bold w-full mt-4">&#21152;&#20837;&#36024;&#27454;</button>
          <div id="loan-list" class="mt-4 flex flex-col gap-2"></div>
        </div>

        <div class="mc-panel variant-stone relative-panel">
          <div class="panel-badge badge-stone">Events</div>
          <h2 class="text-base mb-4 font-bold">&#20154;&#29983;&#20107;&#20214;</h2>
          <label class="text-xs font-bold">&#20107;&#20214;&#39006;&#22411;
            <select id="event-type" class="mc-input-pixel mt-1">
              <option value="one_time">&#19968;&#27425;&#24615;&#25910;&#20837;/&#25903;&#20986;</option>
              <option value="range">&#26399;&#38291;&#25910;&#20837;/&#25903;&#20986;</option>
              <option value="salary_change">&#34218;&#36039;&#35722;&#21205;</option>
            </select>
          </label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">
            <label class="text-xs font-bold event-field one-time-field">&#30332;&#29983;&#26376;&#20221;<input id="event-month" type="number" class="mc-input-pixel mt-1" placeholder="6"></label>
            <label class="text-xs font-bold event-field range-field hidden">&#38283;&#22987;&#26376;&#20221;<input id="event-start" type="number" class="mc-input-pixel mt-1" placeholder="3"></label>
            <label class="text-xs font-bold event-field range-end-field hidden">&#32080;&#26463;&#26376;&#20221;<input id="event-end" type="number" class="mc-input-pixel mt-1" placeholder="12"></label>
            <label class="text-xs font-bold event-field amount-field">&#37329;&#38989;<input id="event-amount" type="number" class="mc-input-pixel mt-1" placeholder="&#25903;&#20986;&#35531;&#36664;&#20837;&#36000;&#25976;"></label>
            <label class="text-xs font-bold event-field salary-field hidden">&#26032;&#26376;&#34218;<input id="event-new-salary" type="number" class="mc-input-pixel mt-1" placeholder="32000"></label>
            <label class="text-xs font-bold sm:col-span-2">&#20633;&#35387;<input id="event-note" type="text" class="mc-input-pixel mt-1" placeholder="&#36023;&#36554;&#38957;&#26399;&#27454;&#12289;&#31199;&#23627;&#12289;&#25563;&#24037;&#20316;"></label>
          </div>
          <button id="btn-add-event" class="btn-pixel bg-yellow text-black font-bold w-full mt-4">&#21152;&#20837;&#20107;&#20214;</button>
          <div id="event-list" class="mt-4 flex flex-col gap-2"></div>
        </div>

        <div class="mc-panel variant-obsidian relative-panel">
          <div class="panel-badge badge-obsidian">Actions</div>
          <button id="btn-run-analysis" class="btn-pixel bg-green text-black font-bold w-full">&#22519;&#34892;&#23436;&#25972;&#20998;&#26512;</button>
          <button id="btn-save-option" class="btn-pixel bg-yellow text-black font-bold w-full mt-3">&#25226;&#30446;&#21069;&#35373;&#23450;&#23384;&#25104;&#26041;&#26696;</button>
          <button id="btn-run-compare" class="btn-pixel bg-gray text-black font-bold w-full mt-3">&#22519;&#34892;&#26041;&#26696;&#27604;&#36611;</button>
        </div>
      </section>

      <section class="flex flex-col gap-5 min-w-0">
        <div class="mc-panel variant-stone relative-panel min-h-[360px]">
          <div class="panel-badge badge-stone">Projection</div>
          <div class="chart-container h-[320px]"><canvas id="financeChart"></canvas></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
          <div class="mc-panel variant-obsidian relative-panel">
            <div class="panel-badge badge-obsidian">Summary</div>
            <div id="summary-panel" class="text-xs leading-7 text-white">&#23578;&#26410;&#22519;&#34892;&#20998;&#26512;&#12290;</div>
          </div>
          <div class="mc-panel variant-obsidian relative-panel">
            <div class="panel-badge badge-obsidian">Monte Carlo + Advice</div>
            <div id="advice-panel" class="text-xs leading-7 text-white">&#23578;&#26410;&#29986;&#29983;&#24314;&#35696;&#12290;</div>
          </div>
        </div>

        <div class="mc-panel variant-stone relative-panel">
          <div class="panel-badge badge-stone">Monthly Details</div>
          <div class="overflow-auto max-h-[360px]">
            <table class="w-full text-xs border-collapse">
              <thead class="sticky top-0 bg-[#c6c6c6]">
                <tr>
                  <th class="p-2 text-left">&#26376;</th>
                  <th class="p-2 text-right">&#25910;&#20837;</th>
                  <th class="p-2 text-right">&#25903;&#20986;</th>
                  <th class="p-2 text-right">&#36024;&#27454;</th>
                  <th class="p-2 text-right">&#20107;&#20214;</th>
                  <th class="p-2 text-right">&#28136;&#29694;&#37329;&#27969;</th>
                  <th class="p-2 text-right">&#36039;&#29986;</th>
                  <th class="p-2 text-right">FSI</th>
                  <th class="p-2 text-left">&#39080;&#38570;</th>
                </tr>
              </thead>
              <tbody id="detail-body"></tbody>
            </table>
          </div>
        </div>

        <div class="mc-panel variant-stone relative-panel">
          <div class="panel-badge badge-stone">Compare</div>
          <div id="option-list" class="flex flex-col gap-2 mb-4"></div>
          <div id="compare-panel" class="text-xs leading-7">&#23578;&#26410;&#22519;&#34892;&#26041;&#26696;&#27604;&#36611;&#12290;</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let currentUser = JSON.parse(sessionStorage.getItem('currentUser') || 'null');
    let currentEvents = [];
    let currentLoans = [];
    let savedOptions = [];
    const $ = (id) => document.getElementById(id);

    const T = {
      notLoggedIn: '\u5c1a\u672a\u767b\u5165\u3002', loggedIn: '\u5df2\u767b\u5165\uff1a', noLoans: '\u5c1a\u672a\u52a0\u5165\u8cb8\u6b3e\u3002', noEvents: '\u5c1a\u672a\u52a0\u5165\u4e8b\u4ef6\u3002', noOptions: '\u5c1a\u672a\u5132\u5b58\u65b9\u6848\u3002', remove: '\u522a\u9664', principal: '\u672c\u91d1', apr: '\u5e74\u5229\u7387', months: '\u500b\u6708', starts: '\u7b2c', month: '\u6708', start: '\u8d77\u9ede', finalBalance: '\u6700\u7d42\u8cc7\u7522', minBalance: '\u671f\u9593\u6700\u4f4e\u8cc7\u7522', maxFsi: '\u6700\u9ad8 FSI', avgFsi: '\u5e73\u5747 FSI', highRiskMonths: '\u9ad8\u98a8\u96aa\u6708\u4efd', firstRiskMonth: '\u7b2c\u4e00\u6b21\u9ad8\u98a8\u96aa\u6708\u4efd', none: '\u7121', income: '\u6536\u5165', fixedExpense: '\u56fa\u5b9a\u652f\u51fa', variableExpense: '\u8b8a\u52d5\u652f\u51fa', bankruptcy: '\u7834\u7522\u6a5f\u7387', avgFinal: '\u5e73\u5747\u6700\u7d42\u8cc7\u7522', bestCase: '\u6700\u4f73\u60c5\u5883', worstCase: '\u6700\u5dee\u60c5\u5883', avgMaxFsi: '\u5e73\u5747\u6700\u9ad8 FSI', bestOption: '\u5efa\u8b70\u65b9\u6848', riskLevel: '\u98a8\u96aa\u7b49\u7d1a', optionBest: '\u6700\u4f73\u65b9\u6848', score: '\u5206\u6578', final: '\u6700\u7d42\u8cc7\u7522', minimum: '\u6700\u4f4e\u8cc7\u7522', saveOptionPrompt: '\u8acb\u8f38\u5165\u65b9\u6848\u540d\u7a31\uff0c\u4f8b\u5982\uff1a\u73fe\u5728\u8cb7\u8eca\u3001\u5ef6\u5f8c 6 \u500b\u6708\u3001\u79df\u5c4b\u65b9\u6848'
    };

    function numberValue(id, fallback = 0) { const value = Number($(id).value); return Number.isFinite(value) ? value : fallback; }
    function escapeHtml(value) { return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
    function formatCurrency(value) { return '$' + Number(value || 0).toLocaleString(undefined, { maximumFractionDigits: 2 }); }
    function formatPercent(value) { return (Number(value || 0) * 100).toFixed(2) + '%'; }
    function riskClass(level) { if (level === 'crisis' || level === 'high') return 'text-red'; if (level === 'medium') return 'text-yellow-700'; return 'text-green'; }

    async function postJson(path, payload) { const response = await fetch(API_BASE + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); const data = await response.json(); if (!response.ok) { const detail = typeof data.detail === 'object' ? JSON.stringify(data.detail) : data.detail; throw new Error(detail || path + ' failed'); } return data; }
    async function apiRequest(path, options = {}) { const response = await fetch(API_BASE + path, options); const data = await response.json(); if (!response.ok) { const detail = typeof data.detail === 'object' ? JSON.stringify(data.detail) : data.detail; throw new Error(detail || path + ' failed'); } return data; }
    function updateAuthStatus() { $('auth-status').textContent = currentUser ? T.loggedIn + currentUser.username + '\uff08' + currentUser.email + '\uff09' : T.notLoggedIn; }
    function buildProfile() { return { balance: numberValue('profile-balance'), salary: numberValue('profile-salary'), fixed_expense: numberValue('profile-fixed'), variable_expense: numberValue('profile-variable'), raise_rate: numberValue('model-raise', 3) / 100, inflation_rate: numberValue('model-inflation', 2) / 100, target_emergency_months: numberValue('model-emergency', 3) }; }
    function buildPayload() { const payload = { profile: buildProfile(), months: Math.max(1, Math.round(numberValue('model-months', 60))), events: currentEvents, loans: currentLoans }; if (currentUser && currentUser.id) payload.user_id = currentUser.id; return payload; }
    function describeEvent(event) { if (event.type === 'one_time') return T.starts + ' ' + event.month + ' ' + T.month + '\uff0c' + formatCurrency(event.amount) + ' ' + (event.note || ''); if (event.type === 'range') return T.starts + ' ' + event.start_month + ' \u5230 ' + event.end_month + ' ' + T.month + '\uff0c\u6bcf\u6708 ' + formatCurrency(event.amount) + ' ' + (event.note || ''); return T.starts + ' ' + event.start_month + ' ' + T.month + '\u8d77\uff0c\u6708\u85aa\u6539\u70ba ' + formatCurrency(event.new_salary) + ' ' + (event.note || ''); }

    function renderLists() {
      $('loan-list').innerHTML = currentLoans.length ? currentLoans.map((loan, index) => `<div class="variant-obsidian p-3 text-white text-xs border-2 border-black flex justify-between gap-3"><span>${T.principal} ${formatCurrency(loan.principal)}?${T.apr} ${(loan.apr * 100).toFixed(2)}%?${loan.months} ${T.months}?${T.starts} ${loan.start_month} ${T.month}\u958b\u59cb</span><button class="text-red font-bold" onclick="removeLoan(${index})">${T.remove}</button></div>`).join('') : '<div class="text-xs text-gray-700">' + T.noLoans + '</div>';
      $('event-list').innerHTML = currentEvents.length ? currentEvents.map((event, index) => `<div class="variant-obsidian p-3 text-white text-xs border-2 border-black flex justify-between gap-3"><span>${escapeHtml(describeEvent(event))}</span><button class="text-red font-bold" onclick="removeEvent(${index})">${T.remove}</button></div>`).join('') : '<div class="text-xs text-gray-700">' + T.noEvents + '</div>';
      $('option-list').innerHTML = savedOptions.length ? savedOptions.map((option, index) => `<div class="variant-obsidian p-3 text-white text-xs border-2 border-black flex justify-between gap-3"><span>${escapeHtml(option.name)}?\u4e8b\u4ef6 ${option.events.length}?\u8cb8\u6b3e ${option.loans.length}</span><button class="text-red font-bold" onclick="removeOption(${index})">${T.remove}</button></div>`).join('') : '<div class="text-xs text-gray-700">' + T.noOptions + '</div>';
    }

    window.removeLoan = (index) => { currentLoans.splice(index, 1); renderLists(); };
    window.removeEvent = (index) => { currentEvents.splice(index, 1); renderLists(); };
    window.removeOption = (index) => { savedOptions.splice(index, 1); renderLists(); };
    function updateEventFields() { const type = $('event-type').value; document.querySelectorAll('.one-time-field').forEach(el => el.classList.toggle('hidden', type !== 'one_time')); document.querySelectorAll('.range-field').forEach(el => el.classList.toggle('hidden', type !== 'range' && type !== 'salary_change')); document.querySelectorAll('.range-end-field').forEach(el => el.classList.toggle('hidden', type !== 'range')); document.querySelectorAll('.amount-field').forEach(el => el.classList.toggle('hidden', type === 'salary_change')); document.querySelectorAll('.salary-field').forEach(el => el.classList.toggle('hidden', type !== 'salary_change')); }
    function buildAdviceOptions(profile, events, loans) { const months = Math.max(1, Math.round(numberValue('model-months', 60))); const monthlySavingsBoost = Math.max(500, Math.round(profile.variable_expense * 0.1)); const incomeBoost = Math.max(1000, Math.round(profile.salary * 0.08)); return [{ name: '\u7dad\u6301\u76ee\u524d\u8a2d\u5b9a', events, loans }, { name: '\u6e1b\u5c11\u8b8a\u52d5\u652f\u51fa 10%', events: [...events, { type: 'range', start_month: 1, end_month: months, amount: monthlySavingsBoost, note: 'reduce_variable_expense' }], loans }, { name: '\u589e\u52a0\u6536\u5165 8%', events: [...events, { type: 'salary_change', start_month: 1, new_salary: profile.salary + incomeBoost, note: 'income_growth_plan' }], loans }]; }

    function renderSummary(summary, profile, mcData) { $('summary-panel').innerHTML = `<div>${T.finalBalance}\uff1a<strong>${formatCurrency(summary.final_balance)}</strong></div><div>${T.minBalance}\uff1a<strong>${formatCurrency(summary.min_balance)}</strong></div><div>${T.maxFsi}\uff1a<strong>${summary.max_fsi ?? 'N/A'}</strong></div><div>${T.avgFsi}\uff1a<strong>${summary.avg_fsi ?? 'N/A'}</strong></div><div>${T.highRiskMonths}\uff1a<strong>${summary.high_risk_months ?? 0}</strong></div><div>${T.firstRiskMonth}\uff1a<strong>${summary.first_risk_month ?? T.none}</strong></div><hr class="my-3 border-gray-600"><div>${T.income} ${formatCurrency(profile.salary)}?${T.fixedExpense} ${formatCurrency(profile.fixed_expense)}</div><div>${T.variableExpense} ${formatCurrency(profile.variable_expense)}</div>`; $('advice-panel').innerHTML = `<div>${T.bankruptcy}\uff1a<strong>${formatPercent(mcData.bankrupt_probability)}</strong></div><div>${T.avgFinal}\uff1a<strong>${formatCurrency(mcData.avg_final_balance)}</strong></div><div>${T.bestCase}\uff1a<strong>${formatCurrency(mcData.best_case_balance)}</strong></div><div>${T.worstCase}\uff1a<strong>${formatCurrency(mcData.worst_case_balance)}</strong></div><div>${T.avgMaxFsi}\uff1a<strong>${mcData.avg_max_fsi ?? 'N/A'}</strong></div>`; }
    function renderDetails(curve) { $('detail-body').innerHTML = curve.map(item => `<tr class="border-t border-gray-500"><td class="p-2">${item.month}</td><td class="p-2 text-right">${formatCurrency(item.income)}</td><td class="p-2 text-right">${formatCurrency(item.expense)}</td><td class="p-2 text-right">${formatCurrency(item.debt_payment)}</td><td class="p-2 text-right">${formatCurrency(item.event_net)}</td><td class="p-2 text-right">${formatCurrency(item.net_cashflow)}</td><td class="p-2 text-right">${formatCurrency(item.balance)}</td><td class="p-2 text-right">${item.fsi}</td><td class="p-2 ${riskClass(item.risk_level)}">${item.risk_level}</td></tr>`).join(''); }
    function updateChart(profile, curve) { financeChart.data.labels = [T.start, ...curve.map(item => item.month % 6 === 0 ? T.starts + item.month + T.month : '')]; financeChart.data.datasets[0].data = [profile.balance, ...curve.map(item => item.balance)]; financeChart.update(); }

    async function runAnalysis() { const button = $('btn-run-analysis'); button.disabled = true; button.textContent = '\u5206\u6790\u4e2d...'; try { const payload = buildPayload(); const mcRuns = Math.max(1, Math.round(numberValue('model-mc-runs', 300))); const [simData, mcData, adviceData] = await Promise.all([postJson('/simulate', payload), postJson('/monte-carlo', { ...payload, simulations: mcRuns }), postJson('/ai/advice', { profile: payload.profile, options: buildAdviceOptions(payload.profile, payload.events, payload.loans), months: payload.months, mc_runs: mcRuns })]); const simResult = simData.result || simData; updateChart(payload.profile, simResult.simulation_curve || []); renderDetails(simResult.simulation_curve || []); renderSummary(simResult.summary || {}, payload.profile, mcData); $('advice-panel').innerHTML += `<hr class="my-3 border-gray-600"><div>${T.bestOption}\uff1a<strong>${escapeHtml(adviceData.best_option || 'N/A')}</strong></div><div>${T.riskLevel}\uff1a<strong>${escapeHtml(adviceData.risk_level || 'unknown')}</strong></div><div class="mt-2">${(adviceData.reason || []).map(escapeHtml).join('<br>')}</div><div class="mt-2 text-yellow-300">${(adviceData.suggestions || []).map(escapeHtml).join('<br>')}</div>`; } catch (error) { alert('\u5206\u6790\u5931\u6557\uff1a' + error.message); } finally { button.disabled = false; button.textContent = '\u57f7\u884c\u5b8c\u6574\u5206\u6790'; } }
    async function runCompare() { if (!savedOptions.length) { alert('\u8acb\u5148\u5132\u5b58\u81f3\u5c11\u4e00\u500b\u65b9\u6848\u3002'); return; } const button = $('btn-run-compare'); button.disabled = true; button.textContent = '\u6bd4\u8f03\u4e2d...'; try { const payload = buildPayload(); const data = await postJson('/compare', { profile: payload.profile, options: savedOptions, months: payload.months, mc_runs: Math.max(1, Math.round(numberValue('model-mc-runs', 300))) }); const compare = data.compare_result || {}; $('compare-panel').innerHTML = `<div class="mb-3">${T.optionBest}\uff1a<strong>${escapeHtml(compare.best_option || 'N/A')}</strong></div><div class="overflow-auto"><table class="w-full text-xs"><thead><tr><th class="p-2 text-left">\u65b9\u6848</th><th class="p-2 text-right">${T.score}</th><th class="p-2 text-right">${T.final}</th><th class="p-2 text-right">${T.minimum}</th><th class="p-2 text-right">${T.maxFsi}</th><th class="p-2 text-right">${T.bankruptcy}</th></tr></thead><tbody>${(compare.options || []).map(option => `<tr class="border-t border-gray-500"><td class="p-2">${escapeHtml(option.name)}</td><td class="p-2 text-right">${option.score}</td><td class="p-2 text-right">${formatCurrency(option.simulation_summary.final_balance)}</td><td class="p-2 text-right">${formatCurrency(option.simulation_summary.min_balance)}</td><td class="p-2 text-right">${option.simulation_summary.max_fsi}</td><td class="p-2 text-right">${formatPercent(option.monte_carlo_summary.bankrupt_probability)}</td></tr>`).join('')}</tbody></table></div><div class="mt-4 text-yellow-900">${escapeHtml((data.advice?.suggestions || []).join(' '))}</div>`; } catch (error) { alert('\u6bd4\u8f03\u5931\u6557\uff1a' + error.message); } finally { button.disabled = false; button.textContent = '\u57f7\u884c\u65b9\u6848\u6bd4\u8f03'; } }

    $('btn-add-loan').addEventListener('click', () => { const loan = { principal: numberValue('loan-principal'), apr: numberValue('loan-apr') / 100, months: Math.round(numberValue('loan-months')), start_month: Math.round(numberValue('loan-start')) }; if (loan.principal < 0 || loan.apr < 0 || loan.months <= 0 || loan.start_month <= 0) { alert('\u8acb\u8f38\u5165\u6709\u6548\u7684\u8cb8\u6b3e\u8cc7\u6599\u3002'); return; } currentLoans.push(loan); ['loan-principal', 'loan-apr', 'loan-months', 'loan-start'].forEach(id => $(id).value = ''); renderLists(); });
    $('btn-login').addEventListener('click', async () => { try { const formData = new URLSearchParams(); formData.append('username', $('auth-username').value.trim()); formData.append('email', $('auth-email').value.trim()); formData.append('password', $('auth-password').value); const data = await apiRequest('/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: formData }); currentUser = data.user || null; if (currentUser) sessionStorage.setItem('currentUser', JSON.stringify(currentUser)); updateAuthStatus(); alert('\u767b\u5165\u6210\u529f\u3002'); } catch (error) { alert('\u767b\u5165\u5931\u6557\uff1a' + error.message); } });
    $('btn-register').addEventListener('click', async () => { try { const data = await postJson('/auth/register', { username: $('auth-username').value.trim(), email: $('auth-email').value.trim(), password: $('auth-password').value }); alert(data.message || '\u8a3b\u518a\u6210\u529f\u3002'); } catch (error) { alert('\u8a3b\u518a\u5931\u6557\uff1a' + error.message); } });
    $('btn-logout').addEventListener('click', () => { currentUser = null; sessionStorage.removeItem('currentUser'); updateAuthStatus(); });
    $('btn-add-event').addEventListener('click', () => { const type = $('event-type').value; const note = $('event-note').value.trim(); let event; if (type === 'one_time') { event = { type, month: Math.round(numberValue('event-month')), amount: numberValue('event-amount'), note }; if (event.month <= 0) return alert('\u8acb\u8f38\u5165\u6709\u6548\u7684\u6708\u4efd\u3002'); } else if (type === 'range') { event = { type, start_month: Math.round(numberValue('event-start')), end_month: Math.round(numberValue('event-end')), amount: numberValue('event-amount'), note }; if (event.start_month <= 0 || event.end_month < event.start_month) return alert('\u8acb\u8f38\u5165\u6709\u6548\u7684\u6708\u4efd\u5340\u9593\u3002'); } else { event = { type, start_month: Math.round(numberValue('event-start')), new_salary: numberValue('event-new-salary'), note }; if (event.start_month <= 0 || event.new_salary < 0) return alert('\u8acb\u8f38\u5165\u6709\u6548\u7684\u85aa\u8cc7\u8b8a\u52d5\u3002'); } currentEvents.push(event); ['event-month', 'event-start', 'event-end', 'event-amount', 'event-new-salary', 'event-note'].forEach(id => $(id).value = ''); renderLists(); });
    $('btn-save-option').addEventListener('click', () => { const name = prompt(T.saveOptionPrompt); if (!name) return; savedOptions.push({ name, events: JSON.parse(JSON.stringify(currentEvents)), loans: JSON.parse(JSON.stringify(currentLoans)) }); renderLists(); });
    $('btn-run-analysis').addEventListener('click', runAnalysis); $('btn-run-compare').addEventListener('click', runCompare); $('event-type').addEventListener('change', updateEventFields);
    const splashTextEl = $('splash-text'); const splashMessages = ['\u60c5\u5883\u6a21\u64ec!', 'FSI \u98a8\u96aa\u6a21\u578b!', 'Monte Carlo Ready!']; let splashIndex = 0; setInterval(() => { splashIndex = (splashIndex + 1) % splashMessages.length; splashTextEl.textContent = splashMessages[splashIndex]; }, 3000);
    const ctx = $('financeChart').getContext('2d'); const financeChart = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [{ label: '\u8cc7\u7522\u9918\u984d', data: [], borderColor: '#5c9e31', backgroundColor: 'rgba(92, 158, 49, 0.2)', borderWidth: 3, stepped: true, pointBackgroundColor: '#85db49', pointBorderColor: '#111', pointRadius: 3, pointHoverRadius: 6 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: 'white' } } }, scales: { y: { ticks: { color: '#9ca3af' }, grid: { color: '#333' } }, x: { ticks: { color: '#9ca3af', maxRotation: 45, minRotation: 45 }, grid: { color: '#333' } } } } });
    updateEventFields(); renderLists(); updateAuthStatus();
  </script>
</body>
</html>
