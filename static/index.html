  <script>
    // ==========================================
    // 🌟 全局變數與元件抓取
    // ==========================================
    const pageRegister = document.getElementById('page-register'); 
    const pageLogin = document.getElementById('page-login');
    const pageSetup1 = document.getElementById('page-setup-1'); 
    const pageSetup2 = document.getElementById('page-setup-2'); 
    const pageDashboard = document.getElementById('page-dashboard');
    const mainLogo = document.getElementById('main-logo'); 
    const aiInsights = document.getElementById('ai-insights');
    const aiScrollbar = document.getElementById('ai-scrollbar');
    const aiScrollThumb = document.getElementById('ai-scroll-thumb');
    const fsiSignal = document.getElementById('fsi-signal');
    const fsiValue = document.getElementById('fsi-value');
    const fsiStatus = document.getElementById('fsi-status');
    const bankruptcySignal = document.getElementById('bankruptcy-signal');
    const bankruptcyValue = document.getElementById('bankruptcy-value');
    const bankruptcyStatus = document.getElementById('bankruptcy-status');
    const API_BASE = window.location.origin;
    const DEMO_MODE = true;
    let currentUser = JSON.parse(sessionStorage.getItem('currentUser') || 'null');
    let currentBalance = 0; 
    let monthlyNetFlow = 0; 
    let currentProfile = null;
    let currentEvents = [];
    let currentLoans = [];

    async function apiRequest(path, options = {}) {
      const response = await fetch(`${API_BASE}${path}`, options);
      const data = await response.json();
      if (!response.ok) {
        const detail = typeof data.detail === 'object' ? JSON.stringify(data.detail, null, 2) : data.detail;
        throw new Error(detail || `${path} 請求失敗`);
      }
      return data;
    }

    function renderApiError(prefix, error) {
      alert(`${prefix}\n${error.message || '請稍後再試'}`);
    }

    function postJson(path, payload) {
      return apiRequest(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    }

    function formatCurrency(value) {
      return `$${Number(value || 0).toLocaleString()}`;
    }

    function formatCompactCurrency(value) {
      const amount = Number(value || 0);
      const sign = amount < 0 ? '-' : '';
      const absAmount = Math.abs(amount);
      if (absAmount >= 1000000) return `${sign}$${(absAmount / 1000000).toFixed(1)}M`;
      if (absAmount >= 10000) return `${sign}$${Math.round(absAmount / 1000)}K`;
      return `${sign}$${Math.round(absAmount).toLocaleString()}`;
    }

    function formatPercent(value) {
      return `${((Number(value) || 0) * 100).toFixed(2)}%`;
    }

    function formatRiskLevel(value) {
      const level = String(value || 'unknown').toLowerCase();
      if (level === 'low') return '低風險';
      if (level === 'medium') return '中風險';
      if (level === 'high') return '高風險';
      if (level === 'crisis') return '危機';
      if (level === 'unknown') return '未知';
      return level;
    }

    function updateRiskWidgets(summary = {}, mcData = {}) {
      const fsi = Number(summary.max_fsi);
      const minBalance = Number(summary.min_balance);
      const bankruptProbability = Number(mcData.bankrupt_probability);

      let fsiLevel = 'low';
      if (Number.isFinite(minBalance) && minBalance < 0) {
        fsiLevel = 'crisis';
      } else if (Number.isFinite(fsi) && fsi >= 0.85) {
        fsiLevel = 'high';
      } else if (Number.isFinite(fsi) && fsi >= 0.6) {
        fsiLevel = 'medium';
      }

      fsiSignal.className = `traffic-signal signal-${fsiLevel}`;
      fsiValue.textContent = Number.isFinite(fsi) ? fsi.toFixed(3) : '--';
      fsiStatus.textContent = formatRiskLevel(fsiLevel);

      let bankruptcyLevel = 'low';
      if (Number.isFinite(bankruptProbability) && bankruptProbability >= 0.15) {
        bankruptcyLevel = 'high';
      } else if (Number.isFinite(bankruptProbability) && bankruptProbability >= 0.05) {
        bankruptcyLevel = 'medium';
      }

      bankruptcySignal.className = `warning-badge risk-${bankruptcyLevel}`;
      bankruptcyValue.textContent = Number.isFinite(bankruptProbability) ? formatPercent(bankruptProbability) : '--';
      bankruptcyStatus.textContent = formatRiskLevel(bankruptcyLevel);
    }

    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    function calculateClientLoanPayment(principal, apr, months) {
      if (!principal || !months) return 0;
      const monthlyRate = Number(apr || 0) / 12;
      if (monthlyRate === 0) return principal / months;
      return principal * monthlyRate / (1 - Math.pow(1 + monthlyRate, -months));
    }

    function getClientDebtPayment(month, loans = []) {
      return loans.reduce((total, loan) => {
        const startMonth = Number(loan.start_month || 1);
        const months = Number(loan.months || 0);
        const endMonth = startMonth + months - 1;
        if (month < startMonth || month > endMonth) return total;
        return total + calculateClientLoanPayment(Number(loan.principal || 0), Number(loan.apr || 0), months);
      }, 0);
    }

    function getClientEventNet(month, events = []) {
      return events.reduce((total, event) => {
        if (event.type === 'one_time' && Number(event.month) === month) {
          return total + Number(event.amount || 0);
        }
        if (event.type === 'range' && month >= Number(event.start_month) && month <= Number(event.end_month)) {
          return total + Number(event.amount || 0);
        }
        return total;
      }, 0);
    }

    function getClientSalary(month, baseSalary, events = []) {
      return events.reduce((salary, event) => {
        if (event.type === 'salary_change' && month >= Number(event.start_month || 1)) {
          return Number(event.new_salary || salary);
        }
        return salary;
      }, baseSalary);
    }

    function runClientScenario(profile, events = [], loans = [], months = 60, stochastic = true) {
      const raiseRate = stochastic ? randomBetween(0.02, 0.05) : 0.03;
      const inflationRate = stochastic ? randomBetween(0.01, 0.04) : 0.02;
      const shockMonth = stochastic && Math.random() < 0.25 ? Math.ceil(Math.random() * months) : null;
      const shockAmount = shockMonth ? Math.round(randomBetween(5000, 50000)) : 0;
      const curve = [];
      let balance = Number(profile.balance || 0);

      for (let month = 1; month <= months; month++) {
        const yearsPassed = Math.floor((month - 1) / 12);
        const baseIncome = Number(profile.salary || 0) * Math.pow(1 + raiseRate, yearsPassed);
        const income = getClientSalary(month, baseIncome, events);
        const expense = Number(profile.fixed_expense || 0)
          + Number(profile.variable_expense || 0) * Math.pow(1 + inflationRate, yearsPassed);
        const debtPayment = getClientDebtPayment(month, loans);
        const eventNet = getClientEventNet(month, events) - (month === shockMonth ? shockAmount : 0);
        const netCashflow = income - expense - debtPayment + eventNet;

        balance += netCashflow;
        const pressure = income > 0 ? (expense + debtPayment) / income : 0.99;
        const fsi = Math.min(0.99, pressure + (balance < 0 ? 0.25 : 0));
        curve.push({
          month,
          balance: Math.round(balance),
          fsi
        });
      }

      const balances = curve.map(item => item.balance);
      const fsiValues = curve.map(item => item.fsi);
      return {
        curve,
        summary: {
          final_balance: balances[balances.length - 1] || Number(profile.balance || 0),
          min_balance: Math.min(Number(profile.balance || 0), ...balances),
          max_fsi: Math.max(...fsiValues),
          avg_fsi: fsiValues.reduce((sum, value) => sum + value, 0) / fsiValues.length,
          high_risk_months: fsiValues.filter(value => value >= 0.85).length,
          first_risk_month: curve.find(item => item.fsi >= 0.85)?.month || null
        }
      };
    }

    function applyFallbackAnalysis(profile, events = [], loans = [], appendSummary = false) {
      const chartScenario = runClientScenario(profile, events, loans, 60, true);
      const monteCarloRuns = Array.from(
        { length: 300 },
        () => runClientScenario(profile, events, loans, 60, true).summary
      );

      const finalBalances = monteCarloRuns.map(item => item.final_balance);
      const minBalances = monteCarloRuns.map(item => item.min_balance);
      const mcData = {
        bankrupt_probability: monteCarloRuns.filter(item => item.min_balance < 0).length / monteCarloRuns.length,
        worst_case_balance: Math.min(...finalBalances),
        best_case_balance: Math.max(...finalBalances),
        avg_final_balance: finalBalances.reduce((sum, value) => sum + value, 0) / finalBalances.length
      };
      const summary = {
        ...chartScenario.summary,
        min_balance: Math.min(...minBalances),
        max_fsi: chartScenario.summary.max_fsi,
        avg_fsi: chartScenario.summary.avg_fsi
      };

      financeChart.data.labels = ['今日', ...chartScenario.curve.map(item => item.month % 6 === 0 ? `第${item.month}個月` : '')];
      financeChart.data.datasets[0].data = [profile.balance, ...chartScenario.curve.map(item => item.balance)];
      financeChart.update();
      updateRiskWidgets(summary, mcData);

      if (appendSummary) {
        appendAiInsight(`
          <div class="font-bold text-green-300 mb-2">已重新執行情境模擬</div>
          <div>這次加入隨機薪資成長、通膨變動與突發支出抽樣，所以每次重新分析的結果可能不同。</div>
          <div class="mt-2">本次圖表期末資產：${formatCurrency(summary.final_balance)}</div>
          <div>Monte Carlo 平均期末資產：${formatCurrency(mcData.avg_final_balance)}</div>
          <div>最差情境：${formatCurrency(mcData.worst_case_balance)}，最佳情境：${formatCurrency(mcData.best_case_balance)}</div>
          <div>破產機率：${formatPercent(mcData.bankrupt_probability)}</div>
        `);
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function appendAiInsight(html) {
      aiInsights.insertAdjacentHTML('beforeend', `
        <div class="message-ai flex items-start gap-2 mt-4">
          <div class="text-xl">💡</div>
          <div class="msg-bubble bg-gray-800 border-2 border-blue-500 p-3 text-white text-xs whitespace-pre-line">
            ${html}
          </div>
        </div>
      `);
      aiInsights.scrollTop = aiInsights.scrollHeight;
      updateAiScrollbar();
    }

    function resetAiConversation() {
      aiInsights.innerHTML = `
        <div class="text-center text-gray-400 text-xs my-2">-- System Online --</div>
        <div class="message-ai flex items-start gap-2">
          <div class="text-xl">🧙‍♂️</div>
          <div class="msg-bubble bg-gray-800 border-2 border-gray-600 p-3 text-white text-xs">
            我是 AI 顧問。我已同步你的初始資料，接下來你每一筆記帳，我都會在此即時結算！
          </div>
        </div>
      `;
      updateAiScrollbar();
    }

    function resetFinancialSetup() {
      currentProfile = null;
      currentBalance = 0;
      monthlyNetFlow = 0;
      currentEvents = [];
      currentLoans = [];

      [
        'setup-balance',

    function updateAiScrollbar() {
      if (!aiInsights || !aiScrollbar || !aiScrollThumb) return;

      const { scrollTop, scrollHeight, clientHeight } = aiInsights;
      const trackHeight = aiScrollbar.clientHeight;
      const canScroll = scrollHeight > clientHeight + 1;

      aiScrollbar.classList.toggle('is-disabled', !canScroll);
      if (!canScroll || trackHeight <= 0) {
        aiScrollThumb.style.height = '100%';
        aiScrollThumb.style.transform = 'translateY(0)';
        return;
      }

      const thumbHeight = Math.max(34, Math.round((clientHeight / scrollHeight) * trackHeight));
      const maxThumbTop = trackHeight - thumbHeight;
      const maxScrollTop = scrollHeight - clientHeight;
      const thumbTop = Math.round((scrollTop / maxScrollTop) * maxThumbTop);

      aiScrollThumb.style.height = `${thumbHeight}px`;
      aiScrollThumb.style.transform = `translateY(${thumbTop}px)`;
    }

    function scrollAiMessagesFromPointer(clientY) {
      const maxScrollTop = aiInsights.scrollHeight - aiInsights.clientHeight;
      if (maxScrollTop <= 0) return;

      const trackRect = aiScrollbar.getBoundingClientRect();
      const thumbHeight = aiScrollThumb.offsetHeight;
      const maxThumbTop = Math.max(1, trackRect.height - thumbHeight);
      const targetThumbTop = Math.min(
        maxThumbTop,
        Math.max(0, clientY - trackRect.top - thumbHeight / 2)
      );
      aiInsights.scrollTop = (targetThumbTop / maxThumbTop) * maxScrollTop;
    }

    async function syncAiAnalysis(profile, events = [], persistSimulation = false, loans = []) {
      const [simData, mcData, adviceData] = await Promise.all([
        postJson('/simulate', {
          profile,
          months: 60,
          events,
          loans,
          user_id: persistSimulation ? (currentUser?.id || null) : null
        }),
        postJson('/monte-carlo', {
          profile,
          months: 60,
          events,
          loans,
          simulations: 300
        }),
        postJson('/ai/advice', {
          profile,
          options: buildAdviceOptions(profile, events, loans),
          months: 60,
          mc_runs: 300
        })
      ]);

      const simResult = simData.result || simData;
      const summary = simResult.summary || {};
      const curve = simResult.simulation_curve || [];
      updateRiskWidgets(summary, mcData);

      if (curve.length) {
        financeChart.data.labels = ['今日', ...curve.map(item => item.month % 6 === 0 ? `第${item.month}個月` : '')];
        financeChart.data.datasets[0].data = [profile.balance, ...curve.map(item => item.balance)];
        financeChart.update();
      }

      appendAiInsight(`
        <div class="font-bold text-yellow-300 mb-2">AI Synchronizer 已接上後端運算</div>
        <div>FSI 最高值：${summary.max_fsi ?? 'N/A'}，平均 FSI：${summary.avg_fsi ?? 'N/A'}</div>
        <div>最低資產水位：${formatCurrency(summary.min_balance)}</div>
        <div>Monte Carlo 破產機率：${formatPercent(mcData.bankrupt_probability)}</div>
        <div>最差情境結餘：${formatCurrency(mcData.worst_case_balance)}</div>
        <div>AI 建議方案：${adviceData.best_option || 'N/A'}（${formatRiskLevel(adviceData.risk_level)}）</div>
        <div class="mt-2">${(adviceData.suggestions || []).join('<br>')}</div>
      `);

      const syncSummaryHtml = [
        '<div class="font-bold text-cyan-300 mb-2">指標說明</div>',
        '<div>FSI（財務壓力指數）可以理解成「你目前的收支有多緊」。這個數值會根據收入、支出與資產變化來判斷壓力程度，通常數值越高，代表現金流越吃緊、可承受風險越低。</div>',
        `<div class="mt-2">以你這次結果來看，最高 FSI 為 ${summary.max_fsi ?? 'N/A'}，平均 FSI 為 ${summary.avg_fsi ?? 'N/A'}，代表系統觀察你在整段模擬期間的壓力高點與整體平均狀況。</div>`,
        `<div class="mt-2">如果高風險月份數為 ${summary.high_risk_months ?? 0}，表示未來可能出現財務壓力偏高的月份；首次高風險月份為 ${summary.first_risk_month ?? '無'}，可以幫助你提早準備現金或調整支出。</div>`,
        '<div class="mt-3">Monte Carlo 模擬則是在同一組財務條件下，加入大量不同的隨機情境，反覆推演未來結果。它不是只告訴你「最可能發生什麼」，而是幫你看出「最好、最差，以及大致平均會落在哪裡」。</div>',
        `<div class="mt-2">這次模擬中，最佳情境為 ${formatCurrency(mcData.best_case_balance)}，最差情境為 ${formatCurrency(mcData.worst_case_balance)}，平均期末餘額為 ${formatCurrency(mcData.avg_final_balance)}。</div>`,
        `<div class="mt-2">Monte Carlo 破產機率為 ${formatPercent(mcData.bankrupt_probability)}，這個數字越高，代表在不同未來情境下出現資金不足的風險越高；越低則代表整體財務結構相對穩定。</div>`
      ].join('');

      appendAiInsight(syncSummaryHtml);

      return { simData, mcData, adviceData };
    }

    });

    // ==========================================
    // 🌟 記帳系統 ＆ AI 財務狀況即時播報
    // ==========================================
    const historyList = document.getElementById('history-list');
    document.getElementById('btn-submit-record').addEventListener('click', async () => {
      const amount = document.getElementById('record-amount').value;
      const note = document.getElementById('record-note').value;
      const date = document.getElementById('record-date').value;

      if (!amount || !note || !date) { 
        alert("⚠️ 請完整填寫金額、備註與日期！"); 
        return; 
      }

      const numAmount = Number(amount);
      const isIncome = numAmount >= 0;
      const colorClass = isIncome ? 'text-green' : 'text-red';
      const sign = isIncome ? '+ ' : '- ';
      const displayAmount = Math.abs(numAmount).toLocaleString(); 

      try {
        if (!currentUser || !currentUser.id) {
          throw new Error("請先登入，系統才能把記帳資料綁定到你的帳號。");
        }

        if (!DEMO_MODE) await postJson('/event/add', {
          user_id: currentUser.id,
          event_type: note,
          amount: numAmount
        });
      } catch (error) {
        renderApiError("❌ 記帳紀錄沒有寫入後端：", error);
        return;
      }

      currentBalance += numAmount; 

      const safeNote = escapeHtml(note);
      const safeDate = escapeHtml(date);
      const recordHTML = `
        <div class="mc-panel variant-obsidian p-2 text-xs border-2 mb-2">
          <div class="text-gray text-xs">${safeDate}</div>
          <div class="flex justify-between mt-1">
            <span>${safeNote}</span>
            <span class="${colorClass}">${sign}$ ${displayAmount}</span>
          </div>
        </div>
      `;
      historyList.insertAdjacentHTML('afterbegin', recordHTML);

      const insightText = isIncome
        ? `💰 收到一筆收入：+ $${displayAmount} (${safeNote})\n\n📊 【最新財務狀態更新】\n目前總資產：$${currentBalance.toLocaleString()}\n正在重新同步 Monte Carlo 與 FSI...`
        : `💸 記下一筆支出：- $${displayAmount} (${safeNote})\n\n📊 【最新財務狀態更新】\n目前總資產降至：$${currentBalance.toLocaleString()}\n正在重新同步 Monte Carlo 與 FSI...`;

      appendAiInsight(insightText);

      if (currentProfile) {
        currentProfile = { ...currentProfile, balance: currentBalance };

        try {
          await syncAiAnalysis(currentProfile, currentEvents, false, currentLoans);
        } catch (error) {
          appendAiInsight(`⚠️ 後端 AI 重新分析失敗：${escapeHtml(error.message || '請稍後再試')}`);
        }
      }

      document.getElementById('record-amount').value = '';
      document.getElementById('record-note').value = '';
      document.getElementById('record-date').value = '';
    });

    // ==========================================
    // 🌟 Chart.js 動態財務圖表初始化
    // ==========================================
    const ctx = document.getElementById('financeChart').getContext('2d');
    const financeChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [], 
        datasets: [{
          label: '總資產變化 (60個月預測)',
          data: [],
          borderColor: '#85db49',
          backgroundColor: 'rgba(133, 219, 73, 0.18)',
          borderWidth: 4,
          fill: true,
          tension: 0.24,
          pointBackgroundColor: '#85db49',
          pointBorderColor: '#111',
          pointBorderWidth: 2,
          pointRadius: context => context.dataIndex % 6 === 0 ? 4 : 0,
          pointHoverRadius: 8,
          pointHitRadius: 12
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        layout: { padding: { left: 22, right: 26, top: 14, bottom: 4 } },
        plugins: {
          legend: {
            labels: {
              color: 'white',
              boxWidth: 32,
              padding: 18,
              font: { family: "'DotGothic16', sans-serif", size: 18, weight: 'bold' }
            }
          },
          tooltip: {
            backgroundColor: '#111827',
            titleColor: '#fde047',
            bodyColor: '#ffffff',
            borderColor: '#85db49',
            borderWidth: 2,
            padding: 12,
            displayColors: false,
            titleFont: { family: "'DotGothic16', sans-serif", size: 16, weight: 'bold' },
            bodyFont: { family: "'DotGothic16', sans-serif", size: 15 },
            callbacks: {
              title: items => items[0]?.label || '',
              label: context => `資產：${formatCurrency(context.parsed.y)}`
            }
          }
        },
        scales: {
          y: {
            title: {
              display: true,
              text: '資產金額',
              color: '#fde047',
              font: { family: "'DotGothic16', sans-serif", size: 16, weight: 'bold' }
            },
            ticks: {
              color: '#e5e7eb',
              padding: 8,
              callback: value => formatCompactCurrency(value),
              font: { family: "'DotGothic16', sans-serif", size: 14, weight: 'bold' }
            },
            grid: { color: 'rgba(255,255,255,0.12)' }
          },
          x: {
            title: {
              display: true,
              text: '月份',
              color: '#fde047',
              font: { family: "'DotGothic16', sans-serif", size: 16, weight: 'bold' }
            },
            ticks: {
              color: '#e5e7eb',
              padding: 8,
              autoSkip: false,
              callback: function(value, index) {
                const label = this.getLabelForValue(value);
                return index === 0 || index % 6 === 0 ? label : '';
              },
              font: { family: "'DotGothic16', sans-serif", size: 14, weight: 'bold' },
              maxRotation: 35,
              minRotation: 35
            },
            grid: { color: 'rgba(255,255,255,0.08)' }
          }
        }
      }
    });

    function refreshDashboardLayout() {
      requestAnimationFrame(() => {
        financeChart.resize();
        updateAiScrollbar();
        requestAnimationFrame(() => {
          financeChart.resize();
          updateAiScrollbar();
        });
      });
    }

    window.addEventListener('resize', refreshDashboardLayout);

    if (DEMO_MODE) {
      startDemoMode();
    }

  </script>
</body>
</html>
