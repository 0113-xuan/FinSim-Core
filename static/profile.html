<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>目前財務狀況｜FutureWallet</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/shell.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script defer src="/planner-model.js"></script><script defer src="/shell-model.js"></script><script defer src="/event-templates.js"></script><script defer src="/event-picker.js"></script><script defer src="/location-model.js"></script><script defer src="/shell.js"></script>
<script defer src="/charts.js"></script><script defer src="/plan-page.js"></script><script defer src="/pages.js"></script>
</head><body class="fw" data-page="profile">
<a class="skip-link" href="#pageContent">跳到主要內容</a>
<button id="menuToggle" class="menu-toggle" type="button" aria-label="開啟選單" aria-controls="shellSidebar" aria-expanded="false">選單</button>
<button id="drawerScrim" class="drawer-scrim" type="button" aria-label="關閉選單" tabindex="-1" hidden></button>
<aside id="shellSidebar" class="shell-sidebar" aria-label="主要導覽"><button id="closeMenu" class="close-menu" type="button">關閉選單</button>
<a class="shell-brand" href="/dashboard.html">FutureWallet</a><nav id="sideNav" aria-label="頁面與計畫"></nav><button type="button" data-sign-out>登出</button></aside>
<main class="shell-main"><div class="page-width"><header class="page-header"><h1 id="pageTitle">目前財務狀況</h1><p class="lede">更新收入、資產與現有貸款，之後的模擬就會使用新的數字。</p></header><p id="pageStatus" role="status" aria-live="polite">正在載入…</p><p id="pageError" class="error" role="alert" hidden></p><div id="pageContent" hidden><p id="accountEmail"></p><div class="actions"><button type="button" data-sign-out>登出</button></div><form id="financeForm"><section class="panel"><fieldset><legend>所在地（選填）</legend><p>用來找你家附近的停車場行情。</p><div class="field-grid"><label>縣市<select name="city" disabled><option value="">選擇縣市（選填）</option></select></label><label>行政區<select name="district" disabled><option value="">請先選擇縣市</option></select></label></div><p id="locationStatus" role="status"></p></fieldset></section><section class="panel"><fieldset><legend>收入與支出</legend><div class="field-grid"><label>每月實領收入<input name="monthly_income" type="number" min="0" max="50000000" step="0.01" required><small>扣掉勞健保、稅之後，實際入帳的金額。</small></label><label>每月固定支出<input name="fixed_expense" type="number" min="0" max="20000000" step="0.01" required><small>房租、帳單等固定花費，不含貸款與投資。</small></label><label>每月變動支出<input name="variable_expense" type="number" min="0" max="20000000" step="0.01" required><small>飲食、交通、購物等生活花費。</small></label></div></fieldset></section><section class="panel"><fieldset><legend>現金與投資</legend><div class="field-grid"><label>可動用現金<input name="cash_balance" type="number" min="-500000000" max="5000000000" step="0.01" required><small>目前可以動用的存款，不包含投資市值。</small></label><label>投資目前市值<input name="investment_value" type="number" min="0" max="5000000000" step="0.01" required><small>目前持有投資的總市值，沒有投資可填 0。</small></label><label>每月投資金額<input name="monthly_investment" type="number" min="0" max="10000000" step="0.01" required><small>每月從現金轉入投資帳戶的金額，沒有投入可填 0。</small></label></div></fieldset></section><section class="panel"><fieldset><legend>現有貸款</legend><p>可新增多筆貸款；沒有貸款可以直接繼續。</p><ul id="debtList" class="saved-list"></ul><div class="field-grid">
<label>貸款名稱<input name="debt_name" maxlength="80"><small>用容易辨認的名稱，例如學貸。</small></label><label>每月還款<input name="monthly_payment" type="number" min="0" max="10000000" step="0.01"><small>這筆貸款每月實際要繳的金額。</small></label><label>剩餘期數（月）<input name="remaining_months" type="number" min="0" max="1200" step="1"><small>還要繳幾個月，已還清可填 0。</small></label></div><div class="actions"><button id="addDebt" type="button">新增貸款</button></div></fieldset></section><section class="panel"><fieldset><legend>偏好</legend><div class="field-grid"><label>年調薪率（小數）<input name="raise_rate" type="number" min="-0.5" max="1" step="any"><small>例如 0.03 代表 3%；留空代表跟著通膨調整。</small></label><label>預備金目標月數<input name="emergency_target_months" type="number" min="0.01" max="36" step="0.01" required value="6"><small>希望預留幾個月生活費與貸款支出。</small></label></div></fieldset></section><div class="actions"><button class="primary" type="submit">儲存財務資料</button></div></form></div></div></main></body></html>
